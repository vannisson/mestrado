[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dt-validation"
version = "0.1.0"
description = "Framework reproducível de verificação e validação de digital twins robóticos"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "jinja2>=3.1,<4",
  "matplotlib>=3.10,<4",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "pyarrow>=19,<24",
  "pydantic>=2.11,<3",
  "pyyaml>=6.0,<7",
  "rich>=13.9,<15",
  "scipy>=1.15,<2",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
coppelia = ["coppeliasim-zmqremoteapi-client==2.0.4"]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pandas-stubs>=2.2,<3",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
  "scipy-stubs>=1.15,<2",
  "types-pyyaml>=6.0,<7",
]

[project.scripts]
dtv = "dt_validation.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/dt_validation"]

[tool.pytest.ini_options]
addopts = "-q --cov=dt_validation --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
exclude = ["legacy"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["dt_validation"]
